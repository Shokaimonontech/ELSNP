<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar In Use</title>
    <!-- Thư viện Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Thư viện PapaParse để đọc dữ liệu từ Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { 
            background-color: #f4f7f6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-title {
            color: #2c3e50;
            font-weight: 800;
            margin-bottom: 30px;
        }
        .grammar-card { 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border: none; 
            border-radius: 12px;
            transition: transform 0.2s ease-in-out;
            height: 100%;
        }
        .grammar-card:hover {
            transform: translateY(-5px);
        }
        .grammar-title { 
            color: #e74c3c; 
            font-weight: bold; 
        }
        .structure-box { 
            font-family: monospace; 
            background: #eaf2f8; 
            color: #2980b9;
            padding: 8px 12px; 
            border-radius: 6px; 
            display: inline-block;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .example-text {
            color: #27ae60;
            font-style: italic;
        }
        #loading {
            text-align: center;
            font-size: 1.2em;
            color: #7f8c8d;
            margin-top: 50px;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="text-center header-title">📚 English Grammar in Use</h1>
    
    <!-- Thanh tìm kiếm -->
    <div class="row justify-content-center mb-4">
        <div class="col-md-8">
            <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="🔍 Tìm kiếm ngữ pháp, cấu trúc, ví dụ..." disabled>
        </div>
    </div>
    
    <!-- Hiệu ứng tải dữ liệu -->
    <div id="loading">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Đang tải dữ liệu trực tiếp từ Google Sheet...</p>
    </div>

    <!-- Nơi chứa các thẻ ngữ pháp -->
    <div id="grammarContainer" class="row">
        <!-- Dữ liệu sẽ tự động đổ vào đây -->
    </div>
</div>

<script>
    // Link xuất file CSV từ Google Sheet của bạn (lấy chính xác từ ID file và GID của tab Grammar)
    const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/1AcU-NAcGq31lVR0ZH0j82-Q7z_Z_-TjejSLbDNCrEyo/export?format=csv&gid=1886218472';
    
    let globalData = [];
    const container = document.getElementById('grammarContainer');
    const searchInput = document.getElementById('searchInput');
    const loading = document.getElementById('loading');

    // Hàm đổi các dấu xuống dòng (Enter) trong sheet thành thẻ <br> trong HTML
    function formatText(text) {
        if (!text) return '';
        // Định dạng chữ "Example:" in đậm
        let formattedText = text.replace(/\n/g, '<br>');
        formattedText = formattedText.replace(/(Example:)/g, '<b>$1</b> <span class="example-text">');
        // Đóng thẻ span cho example (tạm thời xử lý cơ bản)
        formattedText = formattedText.replace(/(Example:.*?)(?=<br><b>|$)/gs, '$1</span>');
        return formattedText;
    }

    // Hàm render thẻ ngữ pháp ra giao diện
    function renderCards(data) {
        container.innerHTML = '';
        if (data.length === 0) {
            container.innerHTML = '<div class="col-12 text-center text-muted mt-4"><h4>Không tìm thấy kết quả nào.</h4></div>';
            return;
        }
        
        data.forEach(item => {
            // Kiểm tra xem dòng đó có dữ liệu Grammar không (bỏ qua dòng trống)
            if(!item['GRAMMAR']) return; 

            let noteContent = formatText(item['NOTE + EXAMPLE']);
            let noteHtml = noteContent ? `<div class="alert alert-warning mt-3 mb-0" style="font-size: 0.9em;"><strong>Lưu ý:</strong><br>${noteContent}</div>` : '';
            
            container.innerHTML += `
                <div class="col-lg-6 mb-4">
                    <div class="card grammar-card">
                        <div class="card-body">
                            <h4 class="card-title grammar-title">${item['GRAMMAR']}</h4>
                            <div class="mt-3"><span class="structure-box">${item['STRUCTURE']}</span></div>
                            <hr>
                            <p class="card-text mb-2"><strong>Ý nghĩa & Cách dùng:</strong><br>${formatText(item['MEAN + EXAMPLE'])}</p>
                            ${noteHtml}
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // Lấy dữ liệu từ Google Sheet bằng PapaParse
    Papa.parse(sheetCsvUrl, {
        download: true,
        header: true, // Lấy dòng đầu tiên làm tiêu đề cột (GRAMMAR, STRUCTURE...)
        complete: function(results) {
            globalData = results.data;
            loading.style.display = 'none'; // Tắt hiệu ứng loading
            searchInput.disabled = false; // Mở khoá thanh tìm kiếm
            renderCards(globalData); // Vẽ dữ liệu ra
        },
        error: function(err) {
            loading.innerHTML = `<p class="text-danger">Lỗi khi tải dữ liệu. Vui lòng kiểm tra lại quyền chia sẻ file Google Sheet.</p>`;
            console.error(err);
        }
    });

    // Xử lý tìm kiếm
    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = globalData.filter(item => {
            // Gom tất cả text của 1 hàng lại để tìm kiếm
            const rowString = Object.values(item).join(' ').toLowerCase();
            return rowString.includes(term);
        });
        renderCards(filtered);
    });
</script>
</body>
</html>
